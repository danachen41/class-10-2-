<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f8fc"><title>日常清單｜任務管理</title>
<style>
:root{--ink:#17233d;--muted:#78839a;--line:#e7ebf2;--blue:#456df5;--bg:#f6f8fc;--white:#fff;--shadow:0 14px 38px #243b6510}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}.side{position:sticky;top:0;height:100vh;padding:26px 18px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;padding:2px 9px 26px;font-size:18px;font-weight:750;letter-spacing:.2px}.brand-icon{width:35px;height:35px;border-radius:12px;background:#edf1ff;color:var(--blue);display:grid;place-items:center;font-size:19px}.profile{display:flex;align-items:center;gap:11px;padding:14px 10px;margin-bottom:25px;background:#f7f8fc;border:1px solid #f0f1f6;border-radius:14px}.avatar{width:38px;height:38px;border-radius:12px;background:#e6ecff;color:#3f63db;font-weight:750;display:grid;place-items:center}.profile-name{font-weight:700}.profile-sub{color:var(--muted);font-size:12px;margin-top:3px}.nav-label{padding:0 11px 9px;color:#a0a7b5;font-size:11px;font-weight:700;letter-spacing:1px}.nav{display:grid;gap:5px}.nav button{width:100%;border:0;background:transparent;text-align:left;color:#68748b;padding:11px 12px;border-radius:10px;font-weight:600;display:flex;align-items:center;gap:12px}.nav button:hover{background:#f5f7fc}.nav button.active{background:#edf1ff;color:#365de5}.nav .ico{width:18px;text-align:center;font-size:16px}.side-bottom{margin-top:auto}.side-stat{background:#f7f8fc;border:1px solid #f0f1f6;border-radius:14px;padding:15px}.side-stat-head{display:flex;justify-content:space-between;font-weight:700;margin-bottom:12px}.side-stat-head span:last-child{color:var(--blue)}.stat-line{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:8px 0}.progress{height:7px;border-radius:8px;background:#e6eaf2;overflow:hidden;margin-top:11px}.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5578ff,#7c9aff);border-radius:8px;transition:width .3s}.side-foot{display:flex;gap:9px;align-items:center;color:#9ba4b5;font-size:11px;padding:17px 7px 0}.dot{width:7px;height:7px;background:#49bc8b;border-radius:50%}.main{max-width:1200px;width:100%;margin:0 auto;padding:39px 48px 64px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:35px}.eyebrow{font-size:11px;color:var(--blue);font-weight:750;letter-spacing:1.3px;text-transform:uppercase}.topbar h1{font-size:26px;letter-spacing:-.6px;margin:7px 0 0}.top-actions{display:flex;align-items:center;gap:11px}.role-pill{border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:#fff;color:#68748b;font-size:12px;font-weight:650}.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:650;transition:.15s}.btn-primary{background:var(--blue);color:#fff;box-shadow:0 5px 13px #456df52b}.btn-primary:hover{background:#355be1;transform:translateY(-1px)}.btn-quiet{background:#fff;border:1px solid var(--line);color:#526079}.btn-quiet:hover{background:#f7f8fc}.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:23px 27px;background:linear-gradient(110deg,#edf1ff,#f1f4ff 55%,#f7f8ff);border:1px solid #e4eaff;border-radius:17px;margin-bottom:21px}.hero h2{font-size:18px;margin:0 0 7px}.hero p{margin:0;color:#77829a;font-size:13px}.hero-mark{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:#fff;color:var(--blue);font-size:22px;box-shadow:0 5px 15px #4259a112}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:27px}.metric{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 3px 12px #1c2e4d05}.metric-label{font-size:12px;color:var(--muted);font-weight:600}.metric-value{font-weight:750;font-size:23px;margin-top:8px;letter-spacing:-.5px}.metric-value small{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:0}.section-head{display:flex;justify-content:space-between;align-items:end;margin:0 0 14px}.section-head h2{font-size:17px;margin:0}.section-head p{color:var(--muted);font-size:12px;margin:5px 0 0}.tools{display:flex;gap:9px;margin-bottom:13px}.search-wrap{position:relative;flex:1}.search-wrap span{position:absolute;left:13px;top:10px;color:#9ca5b5}.search,.select{height:39px;background:#fff;border:1px solid var(--line);border-radius:10px;color:var(--ink);outline:none}.search{width:100%;padding:0 13px 0 36px}.select{padding:0 31px 0 12px}.search:focus,.select:focus,.field input:focus,.field textarea:focus,.field select:focus{border-color:#91a7ff;box-shadow:0 0 0 3px #456df514}.task-list{display:grid;gap:10px}.task{display:flex;align-items:center;gap:14px;padding:15px 17px;background:#fff;border:1px solid var(--line);border-radius:13px;transition:.15s}.task:hover{border-color:#d8e0f1;box-shadow:0 5px 17px #20365a0a}.check{appearance:none;width:19px;height:19px;flex:none;border:1.7px solid #c7cfdd;border-radius:6px;cursor:pointer;position:relative}.check:checked{background:var(--blue);border-color:var(--blue)}.check:checked:after{content:'✓';position:absolute;color:#fff;left:3px;top:-1px;font-weight:700;font-size:14px}.task-copy{flex:1;min-width:0}.task-title{font-size:14px;font-weight:700;overflow-wrap:anywhere}.task-desc{font-size:12px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}.task-meta{display:flex;align-items:center;gap:9px;flex:none;color:#8791a3;font-size:11px}.tag{padding:4px 8px;border-radius:999px;font-weight:700}.tag-High{background:#fff0ed;color:#d65b43}.tag-Medium{background:#fff5df;color:#ae7a18}.tag-Low{background:#eaf1ff;color:#4268d4}.due-late{color:#d45b50}.task.completed .task-title{text-decoration:line-through;color:#9ba4b4}.task-actions{display:flex;gap:4px}.icon-btn{height:31px;min-width:33px;border:0;background:transparent;color:#8b95a6;border-radius:8px}.icon-btn:hover{background:#f3f5fa;color:#44516a}.empty{background:#fff;border:1px dashed #dce2ec;border-radius:14px;text-align:center;padding:48px 20px;color:#77839a}.empty-icon{font-size:27px;margin-bottom:10px}.empty strong{display:block;color:#293650;font-size:14px;margin-bottom:5px}.empty button{margin-top:15px}.toast{position:fixed;right:22px;bottom:22px;padding:12px 16px;border-radius:11px;background:#17233d;color:white;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:10}.toast.show{opacity:1;transform:translateY(0)}.backdrop{position:fixed;inset:0;background:#15213b66;display:none;place-items:center;padding:18px;z-index:20}.backdrop.open{display:grid}.dialog{background:#fff;width:min(100%,460px);border-radius:18px;padding:24px;box-shadow:0 22px 70px #17233d35}.dialog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:19px}.dialog h2{margin:0;font-size:19px}.close{border:0;background:#f3f5f9;color:#66718a;width:31px;height:31px;border-radius:9px;font-size:18px}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:700;color:#58647a;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;background:#fff;color:var(--ink)}.field textarea{resize:vertical;min-height:76px}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:21px}.auth-note{color:var(--muted);font-size:12px;line-height:1.65;margin:0 0 16px}.auth-switch{text-align:center;color:var(--muted);font-size:12px;margin:18px 0 0}.link-btn{border:0;background:none;color:var(--blue);font-weight:700;padding:3px}.demo-note{font-size:11px;color:#97a0af;margin-top:13px;line-height:1.5}.menu-toggle{display:none}
@media(max-width:900px){.app{grid-template-columns:220px 1fr}.main{padding:30px 26px}.metrics{gap:9px}.metric{padding:14px}}
@media(max-width:680px){.app{display:block}.side{position:relative;top:auto;height:auto;padding:13px 16px;border-right:0;border-bottom:1px solid var(--line);display:block}.brand{padding:0}.profile,.nav-label,.side-bottom{display:none}.nav{display:flex;overflow:auto;margin-top:12px}.nav button{width:auto;white-space:nowrap;padding:9px 12px}.nav .ico{display:none}.main{padding:25px 16px 45px}.topbar{align-items:flex-start;margin-bottom:23px}.topbar h1{font-size:22px}.top-actions{gap:7px}.role-pill{display:none}.hero{padding:18px}.metrics{gap:8px}.metric{padding:12px}.metric-value{font-size:19px}.metric-label{font-size:11px}.tools{flex-wrap:wrap}.search-wrap{flex-basis:100%}.select{flex:1}.task{gap:10px;padding:13px}.task-meta{gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:115px}.task-actions{flex-direction:column}.section-head{align-items:flex-start}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand"><div class="brand-icon">✓</div>日常清單</div><div class="profile"><div class="avatar" id="avatar">訪</div><div><div class="profile-name" id="profileName">訪客</div><div class="profile-sub" id="profileSub">資料保存在此裝置</div></div></div><div class="nav-label">工作區</div><nav class="nav"><button class="active" data-filter="all"><span class="ico">▤</span>所有任務</button><button data-filter="pending"><span class="ico">◷</span>待處理</button><button data-filter="completed"><span class="ico">✓</span>已完成</button></nav><div class="side-bottom"><div class="side-stat"><div class="side-stat-head"><span>完成進度</span><span id="sideRate">0%</span></div><div class="stat-line"><span>全部任務</span><b id="sideTotal">0</b></div><div class="stat-line"><span>已完成</span><b id="sideDone">0</b></div><div class="progress"><i id="progress"></i></div></div><div class="side-foot"><i class="dot"></i>你的清單已在本機保存</div></div></aside><main class="main"><header class="topbar"><div><div class="eyebrow">PERSONAL WORKSPACE</div><h1>我的任務</h1></div><div class="top-actions"><span class="role-pill" id="rolePill">訪客模式</span><button class="btn btn-quiet" id="authButton">登入</button><button class="btn btn-primary" id="addButton">＋ 新增任務</button></div></header><section class="hero"><div><h2 id="greeting">一步一步，完成今天的計畫。</h2><p id="heroSub">新增一項任務，讓重要的事有個著落。</p></div><div class="hero-mark">✦</div></section><section class="metrics"><div class="metric"><div class="metric-label">全部任務</div><div class="metric-value" id="totalMetric">0 <small>項</small></div></div><div class="metric"><div class="metric-label">待處理</div><div class="metric-value" id="pendingMetric">0 <small>項</small></div></div><div class="metric"><div class="metric-label">完成率</div><div class="metric-value" id="rateMetric">0<small>%</small></div></div></section><section><div class="section-head"><div><h2 id="listHeading">所有任務</h2><p id="resultCount">目前有 0 項任務</p></div></div><div class="tools"><div class="search-wrap"><span>⌕</span><input class="search" id="search" type="search" placeholder="搜尋任務名稱或備註…"></div><select class="select" id="priority"><option value="all">所有優先級</option><option value="High">高優先級</option><option value="Medium">中優先級</option><option value="Low">低優先級</option></select><select class="select" id="sort"><option value="due">截止日期優先</option><option value="new">最新建立</option><option value="priority">優先級排序</option></select></div><div class="task-list" id="taskList"></div></section></main></div><div class="toast" id="toast"></div>
<div class="backdrop" id="taskBackdrop"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="taskDialogTitle"><div class="dialog-top"><h2 id="taskDialogTitle">新增任務</h2><button class="close" data-close="task">×</button></div><input type="hidden" id="taskId"><div class="field"><label for="titleInput">任務名稱</label><input id="titleInput" maxlength="100" placeholder="例如：完成專題企劃"></div><div class="field"><label for="descInput">備註</label><textarea id="descInput" maxlength="500" placeholder="補充任務細節（選填）"></textarea></div><div class="field"><label for="dateInput">截止日期</label><input id="dateInput" type="date"></div><div class="field"><label for="priorityInput">優先級</label><select id="priorityInput"><option value="High">高</option><option value="Medium" selected>中</option><option value="Low">低</option></select></div><div class="dialog-actions"><button class="btn btn-quiet" data-close="task">取消</button><button class="btn btn-primary" id="saveTask">儲存任務</button></div></section></div>
<div class="backdrop" id="authBackdrop"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="authTitle"><div class="dialog-top"><h2 id="authTitle">登入你的帳號</h2><button class="close" data-close="auth">×</button></div><p class="auth-note" id="authDescription">登入後，你的任務會和此裝置上的帳號連結。</p><form id="authForm"><div class="field" id="nameField" hidden><label for="nameInput">稱呼</label><input id="nameInput" maxlength="40" autocomplete="name" placeholder="你的名字"></div><div class="field"><label for="emailInput">電子郵件</label><input id="emailInput" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="field"><label for="passwordInput">密碼</label><input id="passwordInput" type="password" minlength="6" autocomplete="current-password" required placeholder="至少 6 個字元"></div><button class="btn btn-primary" id="authSubmit" type="submit" style="width:100%">登入</button></form><p class="auth-switch" id="authSwitch"></p><div class="demo-note">此原型的帳號與任務資料僅儲存在目前瀏覽器，尚未連接雲端服務。</div></section></div>
<script>
(()=>{'use strict';const USERS='dailyList.users.v1',SESSION='dailyList.session.v1',GUEST='dailyList.guest.v1';let user=null,filter='all',authMode='login',toastTimer;const $=id=>document.getElementById(id);const safe=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const users=()=>JSON.parse(localStorage.getItem(USERS)||'{}');const saveUsers=value=>localStorage.setItem(USERS,JSON.stringify(value));function loadTasks(){if(user){const u=users()[user.email];return Array.isArray(u?.tasks)?u.tasks:[]}return JSON.parse(localStorage.getItem(GUEST)||'[]')}function saveTasks(list){if(user){const all=users();if(all[user.email]){all[user.email].tasks=list;saveUsers(all)}}else localStorage.setItem(GUEST,JSON.stringify(list))}let tasks=[];function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2300)}function syncIdentity(){const isUser=!!user;$('profileName').textContent=isUser?user.name:'訪客';$('profileSub').textContent=isUser?user.email:'資料保存在此裝置';$('avatar').textContent=isUser?(user.name.trim()[0]||'使'):'訪';$('rolePill').textContent=isUser?'一般使用者':'訪客模式';$('authButton').textContent=isUser?'登出':'登入';$('greeting').textContent=isUser?`嗨，${user.name}，今天也加油。`:'一步一步，完成今天的計畫。';$('heroSub').textContent=isUser?'你的任務已保存在這個帳號中。':'訪客資料保存在目前裝置；登入後可使用個人帳號清單。';tasks=loadTasks();render()}function persist(){saveTasks(tasks);render()}function render(){const total=tasks.length,done=tasks.filter(t=>t.completed).length,pending=total-done,rate=total?Math.round(done/total*100):0;$('totalMetric').innerHTML=`${total} <small>項</small>`;$('pendingMetric').innerHTML=`${pending} <small>項</small>`;$('rateMetric').innerHTML=`${rate}<small>%</small>`;$('sideTotal').textContent=total;$('sideDone').textContent=done;$('sideRate').textContent=rate+'%';$('progress').style.width=rate+'%';const query=$('search').value.trim().toLocaleLowerCase();const priority=$('priority').value;let list=tasks.filter(t=>(filter==='all'||(filter==='pending'&&!t.completed)||(filter==='completed'&&t.completed))&&(priority==='all'||t.priority===priority)&&(!query||`${t.title} ${t.desc||''}`.toLocaleLowerCase().includes(query)));const order={High:0,Medium:1,Low:2};list.sort((a,b)=>{if($('sort').value==='new')return b.createdAt-a.createdAt;if($('sort').value==='priority')return order[a.priority]-order[b.priority];return(a.dueDate||'9999').localeCompare(b.dueDate||'9999')||b.createdAt-a.createdAt});const labels={all:'所有任務',pending:'待處理',completed:'已完成'};$('listHeading').textContent=labels[filter];$('resultCount').textContent=`目前顯示 ${list.length} 項，共 ${total} 項任務`;const listEl=$('taskList');if(!list.length){const message=query||priority!=='all'?'試試調整搜尋文字或篩選條件。':filter==='completed'?'完成的任務會出現在這裡。':'開始建立你的第一項任務吧。';listEl.innerHTML=`<div class="empty"><div class="empty-icon">${query||priority!=='all'?'⌕':'✦'}</div><strong>${query||priority!=='all'?'沒有符合條件的任務':'這裡還沒有任務'}</strong>${safe(message)}${!query&&priority==='all'&&filter!=='completed'?'<br><button class="btn btn-primary" onclick="document.getElementById(\'addButton\').click()">＋ 新增任務</button>':''}</div>`;return}listEl.innerHTML=list.map(t=>{const late=!t.completed&&t.dueDate&&t.dueDate<new Date().toISOString().slice(0,10);const date=t.dueDate?new Date(t.dueDate+'T00:00:00').toLocaleDateString('zh-TW',{year:'numeric',month:'short',day:'numeric'}):'無截止日';const p={High:'高',Medium:'中',Low:'低'}[t.priority]||'中';return `<article class="task ${t.completed?'completed':''}"><input class="check" type="checkbox" aria-label="標記${safe(t.title)}為${t.completed?'未完成':'已完成'}" ${t.completed?'checked':''} data-action="toggle" data-id="${safe(t.id)}"><div class="task-copy"><div class="task-title">${safe(t.title)}</div>${t.desc?`<div class="task-desc">${safe(t.desc)}</div>`:''}</div><div class="task-meta"><span class="${late?'due-late':''}">${late?'逾期 · ':''}${safe(date)}</span><span class="tag tag-${safe(t.priority)}">${p}優先</span></div><div class="task-actions"><button class="icon-btn" aria-label="編輯任務" title="編輯" data-action="edit" data-id="${safe(t.id)}">✎</button><button class="icon-btn" aria-label="刪除任務" title="刪除" data-action="delete" data-id="${safe(t.id)}">⌫</button></div></article>`}).join('')}
function openTask(t){$('taskId').value=t?.id||'';$('taskDialogTitle').textContent=t?'編輯任務':'新增任務';$('titleInput').value=t?.title||'';$('descInput').value=t?.desc||'';$('dateInput').value=t?.dueDate||'';$('priorityInput').value=t?.priority||'Medium';$('taskBackdrop').classList.add('open');setTimeout(()=>$('titleInput').focus(),30)}function close(which){$(which==='task'?'taskBackdrop':'authBackdrop').classList.remove('open')}function saveTask(){const title=$('titleInput').value.trim();if(!title){$('titleInput').focus();toast('請先填寫任務名稱');return}const id=$('taskId').value;const data={title,desc:$('descInput').value.trim(),dueDate:$('dateInput').value,priority:$('priorityInput').value};if(id){tasks=tasks.map(t=>String(t.id)===id?{...t,...data}:t);toast('任務已更新')}else{tasks.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),...data,completed:false,createdAt:Date.now()});toast('已新增任務')}close('task');persist()}function showAuth(mode){authMode=mode;$('authTitle').textContent=mode==='login'?'登入你的帳號':'建立一般使用者帳號';$('authDescription').textContent=mode==='login'?'登入後，繼續管理這個帳號的個人任務。':'註冊後建立你的個人清單；之後可用相同電子郵件與密碼登入。';$('nameField').hidden=mode!=='register';$('nameInput').required=mode==='register';$('passwordInput').autocomplete=mode==='login'?'current-password':'new-password';$('authSubmit').textContent=mode==='login'?'登入':'建立帳號';$('authSwitch').innerHTML=mode==='login'?'還沒有帳號？ <button class="link-btn" type="button" data-auth-mode="register">立即註冊</button>':'已經有帳號？ <button class="link-btn" type="button" data-auth-mode="login">登入</button>'; $('authBackdrop').classList.add('open')}
$('authForm').addEventListener('submit',e=>{e.preventDefault();const email=$('emailInput').value.trim().toLowerCase(),password=$('passwordInput').value,all=users();if(authMode==='register'){if(password.length<6){toast('密碼至少需要 6 個字元');return}if(all[email]){toast('這個電子郵件已註冊，請直接登入');return}all[email]={name:$('nameInput').value.trim()||email.split('@')[0],password,tasks:[]};saveUsers(all);user={email,name:all[email].name};localStorage.setItem(SESSION,email);close('auth');syncIdentity();toast('帳號建立完成')}else{if(!all[email]||all[email].password!==password){toast('電子郵件或密碼不正確');return}user={email,name:all[email].name};localStorage.setItem(SESSION,email);close('auth');syncIdentity();toast('登入成功')}});$('authButton').addEventListener('click',()=>{if(user){user=null;localStorage.removeItem(SESSION);syncIdentity();toast('已登出，目前使用訪客模式')}else showAuth('login')});$('addButton').addEventListener('click',()=>openTask());$('saveTask').addEventListener('click',saveTask);document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>close(b.dataset.close)));document.querySelectorAll('.backdrop').forEach(b=>b.addEventListener('click',e=>{if(e.target===b)b.classList.remove('open')}));document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.backdrop.open').forEach(x=>x.classList.remove('open'));if(e.key==='Enter'&&e.target===$('titleInput')){e.preventDefault();saveTask()}});document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));render()}));['search','priority','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('taskList').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const t=tasks.find(x=>String(x.id)===b.dataset.id);if(!t)return;if(b.dataset.action==='edit')openTask(t);if(b.dataset.action==='toggle'){t.completed=b.checked;persist();toast(t.completed?'已標記為完成':'已恢復待處理')}if(b.dataset.action==='delete'){if(!confirm(`確定刪除「${t.title}」嗎？`))return;tasks=tasks.filter(x=>x!==t);persist();toast('任務已刪除')}});$('authBackdrop').addEventListener('click',e=>{const b=e.target.closest('[data-auth-mode]');if(b)showAuth(b.dataset.authMode)});try{const email=localStorage.getItem(SESSION),all=users();if(email&&all[email])user={email,name:all[email].name};else localStorage.removeItem(SESSION)}catch(e){user=null}syncIdentity()})();
</script></body></html>
