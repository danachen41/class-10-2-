<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f7f4">
<title>日常清單｜今天，慢慢來</title>
<style>
:root{--ink:#292c26;--muted:#85877e;--line:#e9e9e2;--green:#627c5a;--pale:#edf1e9;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;background:#f7f7f4;color:var(--ink)}.topbar{height:68px;padding:0 max(24px,calc((100vw - 1020px)/2));display:flex;align-items:center;justify-content:space-between;background:#ffffffb8;border-bottom:1px solid #eeeee9}.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font:19px Georgia,serif;letter-spacing:.04em}.mark{width:29px;height:29px;display:grid;place-items:center;border-radius:50%;background:var(--pale);color:var(--green)}.topnote{font-size:12px;color:var(--muted);letter-spacing:.08em}main{width:min(100% - 40px,900px);margin:58px auto 64px}.eyebrow{margin:0 0 13px;color:var(--green);font-size:11px;letter-spacing:.2em}h1{margin:0;font:400 clamp(36px,5vw,48px)/1.25 Georgia,serif;letter-spacing:.04em}.date{margin:13px 0 32px;color:var(--muted);font-size:14px}.layout{display:grid;grid-template-columns:1.35fr .9fr;gap:20px;align-items:start}.card{padding:25px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 6px 24px #22271c08}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.heading h2{margin:0;font:400 20px Georgia,serif;letter-spacing:.04em}.count{padding:6px 10px;border-radius:30px;background:var(--pale);color:#4c6646;font-size:11px;white-space:nowrap}.list{padding:8px 0 0;margin:13px 0 0;list-style:none}.item{display:grid;grid-template-columns:20px 1fr auto;align-items:center;gap:13px;min-height:69px;border-top:1px solid #f0f0eb}.check{width:18px;height:18px;margin:0;accent-color:var(--green);cursor:pointer}.copy{min-width:0}.name{display:block;overflow-wrap:anywhere;font-size:14px}.meta{display:block;margin-top:5px;color:var(--muted);font-size:11px}.item.done .name{color:#a0a198;text-decoration:line-through}.item.done .meta{color:#b5b6ae}.time{color:#7e8178;font-size:11px;white-space:nowrap}.empty{padding:20px 0;color:var(--muted);font-size:13px}.form-intro{margin:9px 0 20px;color:var(--muted);font-size:12px;line-height:1.8}.field{display:block;margin-bottom:15px}.label{display:block;margin-bottom:8px;color:#55584f;font-size:11px;letter-spacing:.08em}.field input,.field textarea{display:block;width:100%;border:1px solid #e8e9e2;border-radius:7px;outline:none;background:#fdfdfb;color:var(--ink);font:13px sans-serif}.field input{height:42px;padding:0 11px}.field textarea{min-height:72px;padding:10px 11px;resize:vertical}.field input:focus,.field textarea:focus{border-color:#a4b29b;box-shadow:0 0 0 3px #627c5a17}.row{display:grid;grid-template-columns:1fr 1fr;gap:11px}.add{width:100%;height:43px;border:0;border-radius:7px;background:var(--green);color:#fff;font:12px sans-serif;letter-spacing:.12em;cursor:pointer}.add:hover{background:#4c6646}.foot{margin:22px 0 0;color:#a3a49c;font-size:10px;text-align:center;letter-spacing:.05em}@media(max-width:680px){.topbar{height:60px;padding:0 18px}.topnote{font-size:10px}main{width:min(100% - 32px,480px);margin:40px auto}.date{margin-bottom:24px}.layout{grid-template-columns:1fr;gap:15px}.card{padding:21px}}
</style>
</head>
<body>
<header class="topbar"><a class="brand" href="#top"><span class="mark" aria-hidden="true">✳</span>日常清單</a><span class="topnote">留一點時間，給好好生活</span></header>
<main id="top">
<section aria-labelledby="page-title"><p class="eyebrow">A LITTLE PLAN FOR TODAY</p><h1 id="page-title">今天，慢慢來。</h1><p class="date" id="today-date"></p></section>
<div class="layout">
<section class="card" aria-labelledby="todo-heading"><div class="heading"><h2 id="todo-heading">今日待辦</h2><span class="count" id="count" aria-live="polite"></span></div><ul class="list" id="list" aria-label="今日待辦事項"></ul></section>
<section class="card" aria-labelledby="form-heading"><div class="heading"><h2 id="form-heading">新增行程</h2></div><p class="form-intro">把想做的事寫下來，為今天留一個小小的計畫。</p>
<form id="todo-form">
<label class="field"><span class="label">行程名稱</span><input name="title" type="text" maxlength="80" placeholder="例如：午後散步、完成提案…" required></label>
<div class="row"><label class="field"><span class="label">日期</span><input id="date-input" name="date" type="date" required></label><label class="field"><span class="label">時間</span><input name="time" type="time" value="09:00" required></label></div>
<label class="field"><span class="label">備註（選填）</span><textarea name="note" maxlength="180" placeholder="補充一點小提醒…"></textarea></label>
<button class="add" type="submit">＋　加入今日待辦</button>
</form></section>
</div><p class="foot">不必一次完成所有事，照自己的步調就很好。</p>
</main>
<script>
(()=>{
const pad=n=>String(n).padStart(2,'0');
const today=new Date();
const key=`${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
document.getElementById('today-date').textContent=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(today);
const dateInput=document.getElementById('date-input');dateInput.value=key;dateInput.min=key;
let todos=[{title:'整理今天的工作清單',note:'先列出最重要的三件事',time:'09:00',done:true},{title:'完成本週企劃提案',note:'記得確認簡報的最後一頁',time:'11:30',done:false},{title:'到附近咖啡店散散步',note:'帶上喜歡的書，給自己一點休息',time:'15:00',done:false}];
const list=document.getElementById('list'),count=document.getElementById('count');
const safe=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){
count.textContent=`${todos.filter(t=>t.done).length} / ${todos.length} 項已完成`;list.innerHTML='';
if(!todos.length){const li=document.createElement('li');li.className='empty';li.textContent='今天還沒有行程，新增一筆開始吧。';list.append(li);return;}
todos.forEach((todo,i)=>{const li=document.createElement('li');li.className=`item${todo.done?' done':''}`;const note=todo.note?`<span class="meta">${safe(todo.note)}</span>`:'';li.innerHTML=`<input class="check" type="checkbox" aria-label="完成：${safe(todo.title)}" ${todo.done?'checked':''}><span class="copy"><span class="name">${safe(todo.title)}</span>${note}</span><time class="time">${safe(todo.time)}</time>`;li.querySelector('input').addEventListener('change',e=>{todos[i].done=e.target.checked;render();});list.append(li);});
}
document.getElementById('todo-form').addEventListener('submit',e=>{e.preventDefault();const form=e.currentTarget,data=new FormData(form),title=String(data.get('title')).trim();if(!title)return;todos.push({title,note:String(data.get('note')).trim(),time:String(data.get('time')),done:false});todos.sort((a,b)=>a.time.localeCompare(b.time));render();form.reset();dateInput.value=key;form.elements.time.value='09:00';form.elements.title.focus();});
render();
})();
</script>
</body>
</html>
